<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - CloudID Verify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<div class="container"><div class="card auth-card p-4">
  <h3 class="text-center mb-3">Login</h3>
  <div id="msg"></div>
  <form id="loginForm" novalidate>
    <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">New user? <a href="register.html">Register</a></p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
<script>renderNav();</script>
</body></html>
