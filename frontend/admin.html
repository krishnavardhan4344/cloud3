<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - CloudID Verify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<div class="container my-4">
  <h3 class="mb-3">Admin Dashboard</h3>
  <div id="msg"></div>
  <div class="card p-4 mb-4">
    <h5>Verification Requests</h5>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>User</th><th>Document</th><th>Submitted</th><th>Status</th><th>Remarks</th><th>Actions</th></tr></thead>
        <tbody id="vTable"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="card p-4">
    <h5>All Users</h5>
    <div class="table-responsive">
      <table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th></tr></thead>
      <tbody id="uTable"></tbody></table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
