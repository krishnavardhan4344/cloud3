<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - CloudID Verify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<div class="container my-4">
  <div class="card p-4 mb-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h3 class="mb-1">Welcome, <span id="uname"></span>!</h3>
        <div>Verification status: <span id="curStatus"></span></div>
      </div>
      <div>
        <a href="verification.html" class="btn btn-primary">Upload Document</a>
        <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
  <div class="card p-4">
    <h5>Verification History</h5>
    <div id="msg"></div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Document</th><th>Number</th><th>Submitted</th><th>Status</th></tr></thead>
        <tbody id="history"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
<script>renderNav();</script>
</body></html>
