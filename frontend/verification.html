<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification - CloudID Verify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<div class="container my-4" style="max-width:700px">
  <div class="card p-4">
    <h3 class="mb-3">Identity Verification</h3>
    <div id="msg"></div>
    <form id="vForm" novalidate>
      <div class="mb-3"><label class="form-label">Full Name</label><input id="fullName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Date of Birth</label><input id="dob" type="date" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Document Type</label>
        <select id="docType" class="form-select" required>
          <option value="">Select...</option><option>Aadhaar</option><option>Passport</option>
          <option>Driving License</option><option>Voter ID</option>
        </select></div>
      <div class="mb-3"><label class="form-label">Document Number</label><input id="docNo" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Identity Document (PDF, JPG, JPEG, PNG - max 5 MB)</label>
        <input id="file" type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required></div>
      <div class="mb-3 small">File name: <b id="fileName">No file chosen</b> &nbsp;|&nbsp; Upload status: <b id="upStatus">Not uploaded</b></div>
      <button id="submitBtn" class="btn btn-primary w-100">Submit Verification</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/verification.js"></script>
<script>renderNav();</script>
</body></html>
